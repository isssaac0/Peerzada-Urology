<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager — Dr. Peerzada Faisal Masood</title>
    <!-- Prevents search engines from indexing the admin panel -->
    <meta name="robots" content="noindex" />
    <!-- Absolute path, so this still resolves correctly whether the
         browser is at /admin or /admin/ (the rewrite in next.config.mjs
         that makes plain /admin work doesn't change the address bar,
         which otherwise breaks Decap's default relative config.yml
         lookup). -->
    <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
  </body>
</html>
